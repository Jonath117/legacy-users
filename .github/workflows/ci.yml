name: Integración Continua (CI) - Módulo Usuarios

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas automatizadas
        run: npm run test

      - name: Generar Artefacto
        # GitHub Actions detiene el job automáticamente si un paso anterior falla.
        # Por lo tanto, este artefacto solo se genera si el "npm run test" es exitoso.
        uses: actions/upload-artifact@v4
        with:
          name: legacy-users-build
          path: |
            ./
            !node_modules/
            !.git/
            !.github/